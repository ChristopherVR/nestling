name: Read private camera dependency
description: Configure repository-scoped, read-only SSH access for pub's pinned Git dependency.
inputs:
  ssh-key:
    description: Read-only deploy key for ChristopherVR/nanit-research
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        NANIT_RESEARCH_SSH_KEY: ${{ inputs.ssh-key }}
      run: |
        set -euo pipefail
        test -n "$NANIT_RESEARCH_SSH_KEY" || { echo 'Missing read-only camera dependency key'; exit 1; }
        umask 077
        key_file="$RUNNER_TEMP/nanit-research-key"
        hosts_file="$GITHUB_WORKSPACE/.github/nanit_known_hosts"
        if command -v cygpath >/dev/null 2>&1; then
          key_file="$(cygpath -m "$key_file")"
          hosts_file="$(cygpath -m "$hosts_file")"
        fi
        printf '%s\n' "$NANIT_RESEARCH_SSH_KEY" > "$key_file"
        chmod 600 "$key_file"
        git config --global url."ssh://git@github.com/ChristopherVR/nanit-research.git".insteadOf https://github.com/ChristopherVR/nanit-research.git
        echo "GIT_SSH_COMMAND=ssh -i \"$key_file\" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=\"$hosts_file\"" >> "$GITHUB_ENV"
